services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:15-alpine
    container_name: healthpoint-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthpoint}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-healthpoint}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot Backend API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthpoint-backend
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-healthpoint}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TKysodv5MMn17D}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-tlF339LhKoBgOGIysuMxWrDg}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      CORS_ALLOWED_ORIGINS: "http://localhost:80,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost"
    depends_on:
      postgres:
        condition: service_healthy

  # React Frontend (Nginx SPA + Reverse Proxy) Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthpoint-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
