spring:
  application:
    name: healthpoint-fitness

  datasource:
    url: jdbc:postgresql://localhost:5432/healthpoint
    username: postgres
    password: password # Replace with your actual Postgres password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

razorpay:
  key:
    id: rzp_test_your_key_id_here
    secret: your_secret_key_here

ai:
  openai:
    api-key: ${OPENAI_API_KEY:sk-placeholder}
    base-url: "https://api.openai.com/v1"
    models:
      chat: "gpt-4o-mini"
      reasoning: "gpt-4o"
    timeout-ms: 30000
    max-tokens: 500
    memory-window: 10