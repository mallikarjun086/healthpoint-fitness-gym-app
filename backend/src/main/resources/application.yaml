spring:
  application:
    name: healthpoint-fitness

  datasource:
    url: jdbc:postgresql://localhost:5432/healthpoint
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      indent-output: true

server:
  port: 8085

razorpay:
  key:
    id: rzp_test_TKysodv5MMn17D
    secret: tlF339LhKoBgOGIysuMxWrDg

ai:
  openai:
    api-key: ${OPENAI_API_KEY:sk-placeholder}
    base-url: https://api.openai.com/v1

    models:
      chat: gpt-4o-mini
      reasoning: gpt-4o

    timeout-ms: 30000
    max-tokens: 500
    memory-window: 10

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    com.healthpoint: DEBUG
