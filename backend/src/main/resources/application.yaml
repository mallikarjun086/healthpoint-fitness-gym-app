spring:
  application:
    name: healthpoint-fitness

  datasource:
    url: jdbc:h2:mem:healthpointdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect

  jackson:
    serialization:
      indent-output: true

server:
  port: 8085

razorpay:
  key:
    id: rzp_test_TKysodv5MMn17D
    secret: tlF339LhKoBgOGIysuMxWrDg

ai:
  openai:
    api-key: ${OPENAI_API_KEY:sk-placeholder}
    base-url: https://api.openai.com/v1

    models:
      chat: gpt-4o-mini
      reasoning: gpt-4o

    timeout-ms: 30000
    max-tokens: 500
    memory-window: 10

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    com.healthpoint: DEBUG
