spring:
  application:
    name: healthpoint-fitness

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-long-field-aezhprnh.c-2.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_yuE8r4FHpmLS}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      indent-output: true

server:
  port: ${PORT:8085}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_TKysodv5MMn17D}
    secret: ${RAZORPAY_KEY_SECRET:tlF339LhKoBgOGIysuMxWrDg}

ai:
  openai:
    api-key: ${OPENAI_API_KEY:sk-placeholder}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

    models:
      chat: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      reasoning: ${OPENAI_REASONING_MODEL:gpt-4o}

    timeout-ms: 30000
    max-tokens: 500
    memory-window: 10

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:3000,http://localhost:80,http://localhost}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    com.healthpoint: INFO
